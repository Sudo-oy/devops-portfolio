name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: "v0.8.0"
  HADOLINT_VERSION: "v2.15.1"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  lint:
    name: Lint (Python, Dockerfile, manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - name: ruff
        working-directory: app
        run: |
          ruff format --check .
          ruff check --output-format=github .
      - name: hadolint
        run: |
          curl -fsSL -o hadolint "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          chmod +x hadolint
          ./hadolint app/Dockerfile
      - name: kubeconform (rendered Kustomize manifests)
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz kubeconform
          kubectl kustomize k8s/base > rendered.yaml
          ./kubeconform -strict -summary rendered.yaml
      - name: Validate monitoring files
        run: |
          pip install --quiet pyyaml
          python -c "import json; json.load(open('monitoring/grafana-dashboard.json'))"
          python -c "import glob, yaml; [yaml.safe_load(open(f)) for f in glob.glob('monitoring/*.yaml')]"

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - name: pytest
        working-directory: app
        run: python -m pytest -v

  build:
    name: Build and smoke test the image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        run: docker build -t devops-portfolio:ci app
      - name: Smoke test (read-only filesystem, non-root)
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp -p 8080:8080 devops-portfolio:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q devops-portfolio
          curl -fsS http://localhost:8080/metrics | grep -q http_requests_total
          test "$(docker exec smoke id -u)" = "10001"
          docker rm -f smoke

  security:
    name: Security scan (checkov, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: checkov (Dockerfile and rendered manifests)
        run: |
          pip install --quiet checkov
          mkdir -p .rendered && kubectl kustomize k8s/base > .rendered/manifests.yaml
          checkov --config-file .checkov.yaml -f app/Dockerfile --framework dockerfile
          checkov --config-file .checkov.yaml -f .rendered/manifests.yaml --framework kubernetes
      - name: gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --verbose
