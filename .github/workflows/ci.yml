name: CI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: ./app
        push: true
        tags: yourdockerhubuser/webapp:latest, yourdockerhubuser/webapp:${{ github.sha }}

    - name: Update k8s deployment image (commit)
      run: |
        git config user.name "github-actions"
        git config user.email "actions@users.noreply.github.com"
        # update image tag in k8s manifest
        sed -i "s|yourdockerhubuser/webapp:.*|yourdockerhubuser/webapp:${GITHUB_SHA}|g" k8s/base/deployment.yaml
        git add k8s/base/deployment.yaml
        git commit -m "ci: update image to $GITHUB_SHA"
        git push origin HEAD:main
      env:
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
